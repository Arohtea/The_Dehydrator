name: dehydrator-vm-infra

services:
  postgres:
    image: postgres:16.2
    container_name: dehydrator-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
    command: ["postgres", "-p", "${POSTGRES_PORT:?POSTGRES_PORT is required}"]
    ports:
      - "${HOST_BIND_ADDRESS:?HOST_BIND_ADDRESS is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}:${POSTGRES_PORT}"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p $$POSTGRES_PORT"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dehydrator-rabbitmq
    hostname: ${RABBITMQ_NODE_HOSTNAME:?RABBITMQ_NODE_HOSTNAME is required}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_NODE_PORT: ${RABBITMQ_PORT:?RABBITMQ_PORT is required}
      RABBITMQ_SERVER_START_ARGS: >-
        -rabbitmq_management listener [{port,${RABBITMQ_MANAGEMENT_PORT:?RABBITMQ_MANAGEMENT_PORT is required}}]
    ports:
      - "${HOST_BIND_ADDRESS:?HOST_BIND_ADDRESS is required}:${RABBITMQ_PORT:?RABBITMQ_PORT is required}:${RABBITMQ_PORT}"
      - "${HOST_BIND_ADDRESS:?HOST_BIND_ADDRESS is required}:${RABBITMQ_MANAGEMENT_PORT:?RABBITMQ_MANAGEMENT_PORT is required}:${RABBITMQ_MANAGEMENT_PORT}"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: dehydrator-minio
    command: >-
      server /data
      --address ":${MINIO_API_PORT:?MINIO_API_PORT is required}"
      --console-address ":${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "${HOST_BIND_ADDRESS:?HOST_BIND_ADDRESS is required}:${MINIO_API_PORT:?MINIO_API_PORT is required}:${MINIO_API_PORT}"
      - "${HOST_BIND_ADDRESS:?HOST_BIND_ADDRESS is required}:${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}:${MINIO_CONSOLE_PORT}"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc
    container_name: dehydrator-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://${MINIO_COMPOSE_HOST:?MINIO_COMPOSE_HOST is required}:${MINIO_API_PORT:?MINIO_API_PORT is required} ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required} ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb --ignore-existing myminio/${MINIO_BUCKET:?MINIO_BUCKET is required};
      exit 0;
      "
    restart: "no"

  qdrant:
    image: qdrant/qdrant
    container_name: dehydrator-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      QDRANT__SERVICE__HTTP_PORT: ${QDRANT_HTTP_PORT:?QDRANT_HTTP_PORT is required}
      QDRANT__SERVICE__GRPC_PORT: ${QDRANT_GRPC_PORT:?QDRANT_GRPC_PORT is required}
    ports:
      - "${HOST_BIND_ADDRESS:?HOST_BIND_ADDRESS is required}:${QDRANT_HTTP_PORT:?QDRANT_HTTP_PORT is required}:${QDRANT_HTTP_PORT}"
      - "${HOST_BIND_ADDRESS:?HOST_BIND_ADDRESS is required}:${QDRANT_GRPC_PORT:?QDRANT_GRPC_PORT is required}:${QDRANT_GRPC_PORT}"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: dehydrator-redis
    command:
      - redis-server
      - --port
      - ${REDIS_PORT:?REDIS_PORT is required}
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${HOST_BIND_ADDRESS:?HOST_BIND_ADDRESS is required}:${REDIS_PORT:?REDIS_PORT is required}:${REDIS_PORT}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:?REDIS_PORT is required}", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgresdata:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?POSTGRES_VOLUME_NAME is required}
  rabbitmqdata:
    external: true
    name: ${RABBITMQ_VOLUME_NAME:?RABBITMQ_VOLUME_NAME is required}
  miniodata:
    external: true
    name: ${MINIO_VOLUME_NAME:?MINIO_VOLUME_NAME is required}
  qdrantdata:
    external: true
    name: ${QDRANT_VOLUME_NAME:?QDRANT_VOLUME_NAME is required}
  redisdata:
    external: true
    name: ${REDIS_VOLUME_NAME:?REDIS_VOLUME_NAME is required}
